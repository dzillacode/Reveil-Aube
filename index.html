<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aube</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aube">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#000000">
<style>
/* =========================================================
   AUBE — réveil pour iPad mini 2 (iOS 12 / Safari 12)
   Dérivé de « Réveil » version 3.
   Palette : rouges sur noir pur, sauf pendant le lever de soleil
   (tons chauds : braise → orange → ambre → miel doré).
   ========================================================= */
:root{
  --r1:#ff2a1f;      /* rouge principal : l'heure */
  --r2:#b3150d;      /* rouge moyen : infos secondaires */
  --r3:#4a0805;      /* rouge sombre : séparateurs, inactifs */
  --r4:#1e0302;      /* rouge quasi noir : lignes discrètes */
  --glow:0 0 24px rgba(255,42,31,.30);
  --card:rgba(255,42,31,.07);                      /* fond des cases flottantes */
  --shadow:0 0 38px rgba(255,42,31,.16);           /* halo des cases flottantes */
  --line:#c41d14;                                  /* filet des cases flottantes */
}
/* Mode nuit : tout est tamisé (sauf quand on touche l'écran = .peek) */
body.night:not(.peek){
  --r1:#5e0a06; --r2:#3c0704; --r3:#250302; --r4:#140201; --glow:none;
}
/* Lever de soleil, palier intermédiaire (fond rouge profond → orange brûlé) :
   textes en rouge-orangé plus clair pour garder le contraste. */
body.dawnmid{
  --r1:#ff5c38; --r2:#ff8a5c; --r3:#c0401c; --r4:#7a2400; --glow:none;
  --card:rgba(255,140,90,.12); --shadow:0 12px 34px rgba(30,4,0,.45); --line:#ffb48a;
}
/* Lever de soleil : quand le fond devient clair, textes et boutons passent
   en brun-rouge très foncé pour rester lisibles sur l'orange. */
body.dawnlight{
  --r1:#2e0800; --r2:#4a1000; --r3:#6a1c00; --r4:#7a2400; --glow:none;
  --card:rgba(46,8,0,.10); --shadow:0 14px 32px rgba(90,25,0,.35); --line:#ffe0b8;
}
/* Les panneaux gardent toujours leurs couleurs rouges sur noir */
#panel, #toast, #warn, #unlock{
  --r1:#ff2a1f; --r2:#b3150d; --r3:#4a0805; --r4:#1e0302; --glow:0 0 24px rgba(255,42,31,.30);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:rgba(0,0,0,0)}
html,body{height:100%;background:#000;overflow:hidden}
body{
  color:var(--r1);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;
  -webkit-text-size-adjust:100%;
  touch-action:manipulation;
  cursor:pointer; /* iOS : sans ça, les touchers sur des <div> n'envoient pas de « click » */
}
[data-act], #face, #bar, #panel, #ring{cursor:pointer}
button{-webkit-appearance:none;appearance:none;font:inherit;background:none;border:0;color:inherit;cursor:pointer}
/* Aube : chiffres en Helvetica Neue Light (300), plus épais que l'UltraLight de « Réveil » */
.thin{font-family:"HelveticaNeue-Light","Helvetica Neue",Helvetica,sans-serif;font-weight:300}
.num{font-variant-numeric:tabular-nums;-webkit-font-feature-settings:"tnum";font-feature-settings:"tnum"}
.dim{color:var(--r2)}
.off{display:none!important}

/* ---------- Cadran principal ---------- */
#face{
  position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  -webkit-transition:-webkit-transform 3s ease;transition:transform 3s ease;
}
body.ringing #face{visibility:hidden}
#clockProbe{position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;letter-spacing:-.015em}
/* Changement de couleur en douceur (mode nuit, lever de soleil) */
#clock, #date, #wx, #next, #rTime, #rLabel, #rSt, #ring .bt button, #ring .bt, #bar .btn{
  -webkit-transition:color 3s, background-color 3s, border-color 3s;
  transition:color 3s, background-color 3s, border-color 3s;
}
#wx .sep{-webkit-transition:background-color 3s;transition:background-color 3s}

/* ---------- Lever de soleil ----------
   Deux calques seulement, animés de façon économe pour l'iPad mini 2 :
   - #dawn : couleur de fond changée par paliers (transition linéaire) ;
   - #dawnSun : grande lueur radiale qui monte (opacity + transform uniquement). */
#dawn{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;overflow:hidden;pointer-events:none;
  background-color:#000;
}
#dawnSun{
  position:absolute;left:-30%;bottom:0;width:160%;height:115%;opacity:0;
  background:radial-gradient(ellipse 55% 75% at 50% 100%, rgba(255,214,150,.95) 0%, rgba(255,176,90,.65) 30%, rgba(240,120,40,.25) 60%, rgba(208,98,26,0) 100%);
  -webkit-transform:translateY(60%) translateZ(0);transform:translateY(60%) translateZ(0);
}
#clock{
  font-size:31vw;line-height:.86;letter-spacing:-.015em;white-space:nowrap;
  text-shadow:var(--glow);color:var(--r1);
}
#colon{position:relative;top:-.07em;margin:0 -.02em;-webkit-animation:soft 2s ease-in-out infinite;animation:soft 2s ease-in-out infinite}
#ss{font-size:.16em;vertical-align:top;margin-left:.2em;color:var(--r2);letter-spacing:.05em;text-shadow:none}
/* Date : Medium (500), plus grande et plus vive */
#date{margin-top:2.6vh;font-size:2.8vw;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--r1);padding-left:.3em}
/* Météo : environ 1,6 fois plus grande que dans « Réveil » */
#wx{margin-top:4vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;font-size:2.2vw;letter-spacing:.08em;color:var(--r2);text-transform:uppercase;min-height:7vw;max-width:94vw}
#wx .now svg{width:7.4vw;height:7.4vw;display:block}
#wx .now{display:flex;align-items:center;color:var(--r1)}
#wx .now .t{font-size:5.6vw;margin-left:1.4vw;letter-spacing:0;line-height:1}
#wx .mx{color:var(--r1);white-space:nowrap}
#wx .ar{display:inline-block;width:.72em;height:.9em;vertical-align:-.08em;margin-right:.3em}
/* icônes d'intensité pluie / vent, entre le mot et la valeur */
#wx .wi{display:inline-block;width:1.3em;height:1.3em;vertical-align:-.32em;margin:0 .4em;color:var(--r1)}
/* Météo à la manière de meteo.be : une phrase de temps, puis les chiffres clés */
#wx .col{display:flex;flex-direction:column;line-height:1.5;text-align:left}
#wx .col .c1{color:var(--r1);font-size:1.12em;font-weight:500;letter-spacing:.06em}
#wx .col .c3{font-size:.9em}
#wx .sep{width:1px;height:7.5vw;background:var(--r3);margin:0 2.6vw}
body.night:not(.peek) #wx .c3{display:none}
#next{margin-top:4vh;font-size:1.7vw;letter-spacing:.34em;color:var(--r2);text-transform:uppercase;padding-left:.34em}
#next b{font-weight:500;color:var(--r1)}

@media (orientation:portrait){
  #clock{font-size:30vw}
  #date{font-size:3.6vw}
  #wx{font-size:3vw}
  #wx .now svg{width:10vw;height:10vw}
  #wx .now .t{font-size:7.6vw}
  /* en portrait : météo en colonne, centrée */
  #wx{flex-direction:column}
  #wx .sep{display:none}
  #wx .col{text-align:center;align-items:center;margin-top:1.6vh}
  /* vent et soleil chacun sur sa ligne (évite une coupure au milieu) */
  #wx .c3 .p3{display:block}
  #wx .c3 .d3{display:none}
  #next{font-size:2.4vw}
}

/* ---------- Barre de commandes (apparaît au toucher) ---------- */
#bar{
  position:fixed;left:0;right:0;bottom:0;padding:0 3vw 4vh;
  display:flex;justify-content:center;flex-wrap:wrap;
  opacity:0;pointer-events:none;-webkit-transition:opacity .2s;transition:opacity .2s;z-index:10;
}
#bar.on{opacity:1;pointer-events:auto}
body.dawnlight #bar .btn{background:transparent}
body.dawnlight #bar .btn.solid{background:var(--r1);color:#ffc070}
.btn{
  display:inline-block;border:1px solid var(--r2);color:var(--r1);background:#000;
  font-size:14px;letter-spacing:.28em;text-transform:uppercase;padding:15px 24px 15px 28px;
  border-radius:2px;margin:6px;white-space:nowrap;
}
.btn.solid{background:var(--r1);border-color:var(--r1);color:#000}
.btn.ghost{border-color:var(--r3);color:var(--r2)}
.btn:active{opacity:.6}

/* ---------- Panneau de réglages ---------- */
#panel{
  position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:20;
  display:flex;flex-direction:column;
  -webkit-transition:opacity .2s,-webkit-transform .2s;transition:opacity .2s,transform .2s;
}
#panel.closed{opacity:0;pointer-events:none;-webkit-transform:translateY(14px);transform:translateY(14px)}
#tabs{display:flex;border-bottom:1px solid var(--r3);padding:0 3vw;flex-shrink:0}
.tab{flex:1;padding:24px 0 22px;text-align:center;letter-spacing:.32em;font-size:13px;color:var(--r2);border-bottom:2px solid transparent;text-transform:uppercase}
.tab.on{color:var(--r1);border-bottom-color:var(--r1)}
.tab.x{flex:0 0 80px;font-size:22px;letter-spacing:0}
#pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 5vw 80px}
h3{font-weight:400;font-size:11px;letter-spacing:.4em;color:var(--r2);margin:34px 0 10px;text-transform:uppercase}
.note{font-size:12px;letter-spacing:.12em;color:var(--r2);line-height:1.7;margin:8px 0}
.row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--r4);padding:14px 0;min-height:60px}
.row .lbl{font-size:15px;letter-spacing:.12em}
.row .lbl small{display:block;font-size:11px;letter-spacing:.2em;color:var(--r2);margin-top:5px;text-transform:uppercase}
.al{flex:1}
.al .t{font-size:60px;line-height:1}
.al .m{font-size:11px;letter-spacing:.24em;color:var(--r2);margin-top:6px;text-transform:uppercase}
.row.dis .al{opacity:.4}

/* Interrupteur */
.sw{position:relative;width:60px;height:32px;border:1px solid var(--r3);border-radius:16px;flex-shrink:0}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:var(--r3);-webkit-transition:-webkit-transform .2s;transition:transform .2s}
.sw.on{border-color:var(--r1)}
.sw.on i{background:var(--r1);-webkit-transform:translateX(28px);transform:translateX(28px)}

/* Champs */
input,select{
  -webkit-appearance:none;appearance:none;background:#000;color:var(--r1);
  border:1px solid var(--r3);border-radius:2px;font:inherit;font-size:18px;padding:13px 15px;width:100%;
  -webkit-user-select:text;user-select:text;outline:none;
}
input:focus{border-color:var(--r1)}
input::-webkit-input-placeholder{color:var(--r3)}
input::placeholder{color:var(--r3)}
input[type=time]{font-size:56px;font-weight:100;font-family:"HelveticaNeue-UltraLight","Helvetica Neue",sans-serif;width:auto;padding:6px 18px;min-width:220px}
.small-in{width:auto;min-width:130px;font-size:18px!important;padding:10px 14px!important;min-height:0}
select{width:auto;min-width:120px;font-size:16px;padding:10px 14px}

/* Choix de la police : grille de cartes avec aperçu */
.fonts{display:flex;flex-wrap:wrap;margin-right:-12px}
.fontcard{
  width:30%;width:calc(33.33% - 12px);margin:0 12px 12px 0;padding:16px 10px 12px;
  border:1px solid var(--r3);border-radius:14px;text-align:center;
}
.fontcard.on{border-color:var(--r1);background:rgba(255,42,31,.08)}
.fontcard .fs{display:block;font-size:46px;line-height:1.05;color:var(--r1);white-space:nowrap}
.fontcard .fn{display:block;margin-top:8px;font-size:10px;letter-spacing:.18em;color:var(--r2);text-transform:uppercase}
.fontcard.on .fn{color:var(--r1)}
@media (orientation:portrait){.fontcard{width:calc(50% - 12px)}}

/* Curseurs de durée */
.row.rng{display:block}
.rctl{display:flex;align-items:center;margin-top:14px}
.rctl .ib{margin:0;min-width:52px;height:46px;font-size:22px;letter-spacing:0;padding:0;border-radius:10px}
.rval{min-width:84px;text-align:right;font-size:20px;color:var(--r1)}
/* Curseur entièrement dessiné par l'appli (pas le curseur de Safari, dont iOS 12
   impose son bouton blanc) :
   - .sl-line : fine ligne rouge sur toute la largeur, sous le bouton rond ;
   - .sl-fill : partie déjà parcourue, en rouge vif ;
   - .sl-knob : bouton rond rouge. Positions calculées en JS (sliderPos). */
.sld{position:relative;-webkit-flex:1;flex:1;height:46px;margin:0 14px;cursor:pointer}
.sl-line{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#a3160e;border-radius:1px}
.sl-fill{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;background:#ff2a1f;border-radius:2px}
.sl-knob{
  position:absolute;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:15px;
  background:#ff2a1f;box-shadow:0 0 0 4px rgba(255,42,31,.18),0 0 14px rgba(255,42,31,.5);
}
.sld.drag .sl-knob{box-shadow:0 0 0 8px rgba(255,42,31,.22),0 0 18px rgba(255,42,31,.6)}

.days{display:flex;flex-wrap:wrap}
.day{width:52px;height:52px;border:1px solid var(--r3);border-radius:26px;display:flex;align-items:center;justify-content:center;margin:0 10px 10px 0;color:var(--r2);font-size:15px}
.day.on{background:var(--r1);border-color:var(--r1);color:#000}

/* Stations */
.st{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--r4)}
.st .n{flex:1;font-size:16px;letter-spacing:.06em;overflow:hidden}
.st .n small{display:block;color:var(--r2);font-size:10px;letter-spacing:.2em;margin-top:4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.dis{opacity:.35}
.ib{min-width:50px;height:44px;border:1px solid var(--r3);margin-left:8px;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.2em;padding:0 12px;text-transform:uppercase;color:var(--r1)}
.ib.on{background:var(--r1);color:#000;border-color:var(--r1)}
.grp{font-size:10px;letter-spacing:.4em;color:var(--r3);margin:18px 0 2px}
.banner{border:1px solid var(--r1);padding:14px 16px;margin-top:22px;font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.flex{display:flex;align-items:center}
.flex > input{flex:1}

/* ---------- Écran de sonnerie ---------- */
/* Fond transparent : on voit le lever de soleil (#dawn) derrière */
#ring{position:fixed;top:0;left:0;width:100%;height:100%;background:transparent;z-index:30;display:flex;flex-direction:column}
#ring .top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
#rTime{font-size:22vw;line-height:.9;text-shadow:var(--glow);-webkit-animation:soft 1.6s ease-in-out infinite;animation:soft 1.6s ease-in-out infinite}
#rLabel{font-size:2.2vw;letter-spacing:.45em;text-transform:uppercase;margin-top:3vh;padding-left:.45em}
#rSt{font-size:1.5vw;letter-spacing:.3em;color:var(--r2);text-transform:uppercase;margin-top:2vh}
/* Boutons en cases « flottantes » : coins arrondis et halo, détachées du bord.
   Elles restent immobiles. SNOOZE est la grande case, STOP la plus étroite. */
#ring .bt{display:flex;align-items:flex-end;padding:0 5vw 6vh}
#ring .bt button{
  height:25vh;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:3.4vw;letter-spacing:.42em;padding-left:.42em;
  box-shadow:var(--shadow);
}
#ring .bt button:active{opacity:.7}
#ring .bt small{font-size:.3em;letter-spacing:.3em;margin-top:1.6vh;color:var(--r2)}
/* Contour toujours visible, quelle que soit la couleur du fond :
   un filet clair (--line) doublé d'un filet sombre à l'extérieur.
   Sur fond noir on voit le filet rouge, sur fond orange/ambre le filet sombre. */
#ring .bt .snz{
  -webkit-flex:1.8;flex:1.8;margin-right:3.5vw;background:var(--card);color:var(--r1);
  border:2px solid var(--line);
  box-shadow:0 0 0 2px rgba(22,3,0,.7), var(--shadow);
}
#ring .bt .stp{
  -webkit-flex:1;flex:1;background:var(--r1);border:2px solid var(--line);color:#000;
  box-shadow:0 0 0 2px rgba(22,3,0,.7), var(--shadow);
}
#ring .stp small{color:#000;opacity:.6}
body.dawnlight #ring .stp, body.dawnlight #ring .stp small{color:#ffc070}
@media (orientation:portrait){
  #rLabel{font-size:3vw}#rSt{font-size:2.2vw}
  #ring .bt{padding-bottom:5vh}
  #ring .bt button{font-size:4.6vw;height:18vh;border-radius:24px}
}

/* ---------- Écran de déverrouillage audio ---------- */
#unlock{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#unlock .big{font-size:2.2vw;letter-spacing:.45em;border:1px solid var(--r1);padding:3.4vh 4vw 3.4vh calc(4vw + .45em);-webkit-animation:soft 2.4s ease-in-out infinite;animation:soft 2.4s ease-in-out infinite}
#unlock p{color:var(--r2);margin-top:5vh;font-size:12px;letter-spacing:.24em;line-height:2;max-width:70%;text-transform:uppercase}
@media (orientation:portrait){#unlock .big{font-size:3.4vw}}

#warn{position:fixed;top:0;left:0;right:0;text-align:center;padding:12px;font-size:12px;letter-spacing:.3em;background:var(--r1);color:#000;z-index:40;-webkit-animation:soft 1s ease-in-out infinite;animation:soft 1s ease-in-out infinite;text-transform:uppercase}
#toast{position:fixed;bottom:14vh;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);border:1px solid var(--r2);padding:13px 22px;font-size:12px;letter-spacing:.25em;background:#000;opacity:0;-webkit-transition:opacity .2s;transition:opacity .2s;z-index:60;pointer-events:none;text-transform:uppercase;white-space:nowrap}
#toast.on{opacity:1}

@-webkit-keyframes soft{0%,100%{opacity:1}50%{opacity:.28}}
@keyframes soft{0%,100%{opacity:1}50%{opacity:.28}}
</style>
</head>
<body>

<div id="dawn"><div id="dawnSun"></div></div>

<div id="face">
  <div id="clock" class="thin num"><span id="hh">--</span><span id="colon">:</span><span id="mm">--</span><span id="ss"></span></div>
  <div id="date"></div>
  <div id="wx"></div>
  <div id="next"></div>
</div>
<!-- sert à mesurer la largeur de l'heure dans la police choisie -->
<span id="clockProbe" class="num" aria-hidden="true">00:00</span>

<div id="bar"></div>
<div id="warn" class="off"></div>

<div id="ring" class="off">
  <div class="top">
    <div id="rTime" class="thin num">--:--</div>
    <div id="rLabel">Réveil</div>
    <div id="rSt"></div>
  </div>
  <div class="bt">
    <button class="snz" data-act="snooze">SNOOZE<small id="rSnz">9 MIN</small></button>
    <button class="stp" data-act="stop">STOP<small>ARRÊTER</small></button>
  </div>
</div>

<div id="panel" class="closed">
  <div id="tabs"></div>
  <div id="pbody"></div>
</div>

<div id="unlock">
  <div class="big">TOUCHER POUR ACTIVER</div>
  <p>Le son doit être activé d'un toucher à chaque ouverture de l'application.<br>Laissez ensuite l'iPad sur cet écran, branché.<br><br>Aube · version 7</p>
</div>

<div id="toast"></div>

<audio id="aDirect" playsinline webkit-playsinline preload="none"></audio>
<audio id="aFade" playsinline webkit-playsinline preload="none"></audio>

<script>
/* =========================================================
   JavaScript compatible Safari 12 : pas de ?. ni ??,
   pas de champs privés, pas d'AbortController.
   ========================================================= */
(function () {
'use strict';

function $(id) { return document.getElementById(id); }
var DAYS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var DAYS_S = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
var MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var WEEK = [1,2,3,4,5,6,0];               // ordre d'affichage lundi → dimanche
var WEEK_L = ['L','M','M','J','V','S','D'];
var PAGE_HTTPS = location.protocol === 'https:';
/* Clés distinctes de l'appli « Réveil » : les deux applis sont publiées sur le même
   domaine (même localStorage), elles ne doivent pas mélanger leurs alarmes. */
var KEY = 'aube.v1', KEY_WX = 'aube.wx', KEY_ST = 'aube.st';

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function hhmm(t) { var d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function norm(s) {

function fmtMin(k, v) {
  if (k === 'dawnBefore' && v === 0) return 'Non';
  return v >= 60 ? '1 h' : v + ' min';
}
function rangeRow(k, label, sub, min, max) {
  return '<div class="row rng"><div class="lbl">' + label + '<small>' + sub + '</small></div>' +
    '<div class="rctl"><button class="ib" data-act="rstep" data-v="' + k + '" data-d="-1">−</button>' +
    '<div class="sld" id="sl-' + k + '" data-k="' + k + '" data-min="' + min + '" data-max="' + max + '">' +
      '<div class="sl-line"></div>' +
      '<div class="sl-fill" style="width:calc(15px + (100% - 30px) * ' + ((S[k] - min) / (max - min)).toFixed(4) + ')"></div>' +
      '<div class="sl-knob" style="left:calc((100% - 30px) * ' + ((S[k] - min) / (max - min)).toFixed(4) + ')"></div></div>' +
    '<button class="ib" data-act="rstep" data-v="' + k + '" data-d="1">+</button>' +
    '<span class="rval num" id="rv-' + k + '">' + fmtMin(k, S[k]) + '</span></div></div>';
}
/* Place le bouton rond et la partie rouge vif selon la valeur (bouton de 30 px) */
function sliderPos(k, v) {
  var s = $('sl-' + k); if (!s) return;
  var min = +s.getAttribute('data-min'), max = +s.getAttribute('data-max');
  var p = max > min ? (v - min) / (max - min) : 0;
  s.querySelector('.sl-knob').style.left = 'calc((100% - 30px) * ' + p.toFixed(4) + ')';
  s.querySelector('.sl-fill').style.width = 'calc(15px + (100% - 30px) * ' + p.toFixed(4) + ')';
}
function updRangeLabel(k, v) {
  var el = $('rv-' + k); if (el) el.textContent = fmtMin(k, v);
  sliderPos(k, v);
}
/* Glisser le curseur au doigt (ou à la souris) : la valeur suit la position */
var SL = null;
function slFromEvent(e) {
  var t = e.changedTouches ? e.changedTouches[0] : e;
  var r = SL.el.getBoundingClientRect();
  var p = Math.max(0, Math.min(1, (t.clientX - r.left - 15) / Math.max(1, r.width - 30)));
  var v = Math.round(SL.min + p * (SL.max - SL.min));
  if (v !== S[SL.k]) { S[SL.k] = v; updRangeLabel(SL.k, v); }
}
function slStart(e) {
  var t = e.target;
  while (t && t !== document.body && !(t.classList && t.classList.contains('sld'))) t = t.parentNode;
  if (!t || t === document.body) return;
  SL = { el: t, k: t.getAttribute('data-k'), min: +t.getAttribute('data-min'), max: +t.getAttribute('data-max') };
  t.classList.add('drag');
  slFromEvent(e);
  e.preventDefault();          // pas de défilement du panneau pendant le réglage
}
function slMove(e) { if (SL) { slFromEvent(e); e.preventDefault(); } }
function slEnd() { if (SL) { SL.el.classList.remove('drag'); SL = null; save(); } }
document.addEventListener('touchstart', slStart, { passive: false });
document.addEventListener('touchmove', slMove, { passive: false });
document.addEventListener('touchend', slEnd);
document.addEventListener('touchcancel', slEnd);
document.addEventListener('mousedown', slStart);
document.addEventListener('mousemove', slMove);
document.addEventListener('mouseup', slEnd);
function sw(on, act, v) { return '<div class="sw' + (on ? ' on' : '') + '" data-act="' + act + '" data-v="' + (v || '') + '"><i></i></div>'; }

function stRow(st) {
  var ok = playable(st), on = R.url === st.url && !R.ringing;
  var meta = [st.codec, st.br ? st.br + ' kbps' : '', st.https ? '' : 'http'].filter(Boolean).join(' · ');
  var attrs = ' data-url="' + esc(st.url) + '" data-name="' + esc(st.name) + '"';
  var h = '<div class="st' + (ok ? '' : ' dis') + '"><div class="n">' + esc(st.name) + '<small>' + esc(meta) + '</small></div>';
  if (ok) {
    h += '<button class="ib' + (on ? ' on' : '') + '" data-act="st-play"' + attrs + '>' + (on ? '■' : '▶') + '</button>';

}

function syncDraft() {
  if (P.view !== 'edit' || !P.draft) return;
  var t = $('edTime'), l = $('edLabel');
  if (t && t.value) { var p = t.value.split(':'); P.draft.h = +p[0]; P.draft.m = +p[1]; }
  if (l) P.draft.label = l.value;
}

var cityT = 0;

  if (q.length < 2) { $('cityRes').innerHTML = ''; return; }
  cityT = setTimeout(function () {

/* ---------------- Actions ---------------- */
function findAlarm(id) { for (var i = 0; i < S.alarms.length; i++) if (S.alarms[i].id === id) return S.alarms[i]; return null; }

function act(name, el) {
  var v = el.getAttribute('data-v');
  var url = el.getAttribute('data-url'), sname = el.getAttribute('data-name');
  switch (name) {
    case 'open': openPanel(v); break;
    case 'close': closePanel(); break;
    case 'tab': syncDraft(); P.view = v; P.choose = false; P.draft = null; renderPanel(); if (v === 'radio') fetchStations(); break;
    case 'stopradio': stopAudio(); hideBar(); break;
    case 'snooze': snooze(); break;
    case 'stop': stopRing(); break;

    case 'al-toggle': var a = findAlarm(v); if (a) { a.on = !a.on; save(); renderPanel(); renderNext(); } break;
    case 'al-new': P.draft = { id: 'a' + Date.now(), h: 7, m: 0, label: 'Réveil', days: [1,2,3,4,5], on: true, station: null, isNew: true }; P.view = 'edit'; renderPanel(); break;
    case 'al-edit': var a2 = findAlarm(v); if (a2) { P.draft = JSON.parse(JSON.stringify(a2)); P.view = 'edit'; renderPanel(); } break;
    case 'ed-day':
      syncDraft(); var dd = +v, ix = P.draft.days.indexOf(dd);
      if (ix >= 0) P.draft.days.splice(ix, 1); else P.draft.days.push(dd);
      renderPanel(); break;
    case 'ed-station': syncDraft(); P.view = 'radio'; P.choose = true; P.q = ''; renderPanel(); fetchStations(); break;
    case 'ed-save':
      syncDraft(); var d = P.draft; delete d.isNew; d.on = true;
      var ex = findAlarm(d.id);
      if (ex) { for (var k in d) ex[k] = d[k]; } else S.alarms.push(d);
      save(); P.draft = null; P.view = 'alarms'; renderPanel(); renderNext();
      var n = nextOcc(d, Date.now()); if (n) toast('Réveil dans ' + Math.floor((n - Date.now()) / 3600000) + ' h ' + pad(Math.floor((n - Date.now()) / 60000) % 60));
      break;
    case 'ed-cancel': P.draft = null; P.view = 'alarms'; renderPanel(); break;
    case 'ed-del': S.alarms = S.alarms.filter(function (x) { return x.id !== P.draft.id; }); save(); P.draft = null; P.view = 'alarms'; renderPanel(); renderNext(); break;

    case 'st-play':
      if (R.ringing) break;
      if (R.url === url) stopAudio(); else { sleepAt = 0; playStream({ url: url, name: sname }, {}); }
      renderStList(); break;
    case 'st-pick':
      if (R.url && !R.ringing) stopAudio();
      P.draft.station = url ? { url: url, name: sname } : null;
      P.choose = false; P.view = 'edit'; renderPanel(); break;
    case 'st-def':
      S.defStation = (S.defStation && S.defStation.url === url) ? null : { url: url, name: sname };
      save(); renderPanel(); break;
    case 'man-play': case 'man-pick':
      var mu = ($('manUrl').value || '').trim();
      if (!/^https?:\/\//i.test(mu)) { toast('Adresse invalide'); break; }
      if (PAGE_HTTPS && /^http:/i.test(mu)) { toast('HTTP bloqué en HTTPS'); break; }
      var mst = { url: mu, name: 'Flux manuel' };
      if (name === 'man-play') { if (!R.ringing) playStream(mst, {}); }
      else if (P.choose) { P.draft.station = mst; P.choose = false; P.view = 'edit'; renderPanel(); }
      else { S.defStation = mst; save(); renderPanel(); toast('Station par défaut enregistrée'); }
      break;
    case 'sleep':
      if (!S.defStation) { toast('Choisissez d\'abord une station ★'); break; }
      playStream(S.defStation, {}); sleepAt = Date.now() + (+v) * 60000; closePanel(); toast('Arrêt dans ' + v + ' min'); break;

    case 'set-toggle': S[v] = !S[v]; save(); renderPanel(); updNight(); render(); break;
    case 'font': S.font = v; save(); fitClock(); renderPanel(); break;
    case 'dawnoff': dawnOff(); break;
    case 'rstep':   // boutons − / + des curseurs de durée
      var rmin = v === 'dawnMin' ? 1 : 0;
      S[v] = Math.max(rmin, Math.min(60, (+S[v] || 0) + (+el.getAttribute('data-d'))));
      save(); updRangeLabel(v, S[v]); break;
    case 'city-pick':
      S.city = { name: sname, lat: +el.getAttribute('data-lat'), lon: +el.getAttribute('data-lon') };
      save(); WX = null; fetchWx(); renderPanel(); toast('Météo : ' + sname); break;
    case 'test':
      pendingAt = Date.now() + 60000;
      pendingAlarm = { label: 'Test', station: S.defStation };
      closePanel(); renderNext(); toast('Alarme de test dans 1 min'); break;
    case 'dawntest':
      if (R.ringing) break;
      closePanel(); hideBar();
      D.level = 0; dawnStart(30000, { test: true });
      toast('Touchez l\'écran pour arrêter'); break;
    case 'refresh': WX = null; fetchWx(); STATIONS = null; fetchStations(true); renderPanel(); toast('Actualisation…'); break;
  }
}

/* Délégation des événements.
   Sur iOS 12, le « click » n'est pas toujours émis : on traite donc nous-mêmes
   les touchers (touchend) et on garde le click pour la souris. */
function handleTap(target) {
  if (D.test) { dawnFade(3); return; }   // un toucher arrête le test du lever de soleil
  var t = target;
  while (t && t !== document.body && !(t.getAttribute && t.getAttribute('data-act'))) t = t.parentNode;
  if (t && t !== document.body && t.getAttribute && t.getAttribute('data-act')) { act(t.getAttribute('data-act'), t); return; }
  if (!unlocked) { doUnlock(); return; }
  // toucher « vide » sur l'écran principal
  if (!P.open && !R.ringing) showBar();
}
function isField(el) {
  return el && /^(INPUT|SELECT|TEXTAREA|OPTION|LABEL)$/.test(el.tagName);
}
var touch = null, lastTouchTap = 0;
document.addEventListener('touchstart', function (e) {
  var p = e.changedTouches[0];
  touch = { x: p.clientX, y: p.clientY, t: Date.now() };
}, { passive: true });
document.addEventListener('touchend', function (e) {
  resumeAudio();
  if (!touch) return;
  var p = e.changedTouches[0], st = touch; touch = null;
  if (Math.abs(p.clientX - st.x) > 12 || Math.abs(p.clientY - st.y) > 12 || Date.now() - st.t > 800) return; // défilement
  if (isField(e.target)) return;      // laisser iOS ouvrir le clavier / la roue de l'heure
  try { document.activeElement && isField(document.activeElement) && document.activeElement.blur(); } catch (er) {}
  e.preventDefault();                 // empêche le click synthétique (pas de double action)
  lastTouchTap = Date.now();
  handleTap(e.target);
}, { passive: false });
document.addEventListener('click', function (e) {
  if (Date.now() - lastTouchTap < 800) return;
  handleTap(e.target);
});
/* Bug iOS Safari : un « click » délégué au document n'est pas émis quand on touche
   un élément non cliquable. Un gestionnaire vide sur chaque zone règle le problème. */
['face', 'bar', 'panel', 'ring', 'tabs', 'pbody'].forEach(function (id) { $(id).onclick = function () {}; });

document.addEventListener('input', function (e) {
  var id = e.target.id;
  var rk = e.target.getAttribute && e.target.getAttribute('data-set');
  if (rk && e.target.type === 'range') { updRangeLabel(rk, +e.target.value); return; }  // valeur affichée en direct
  if (id === 'q') { P.q = e.target.value; clearTimeout(searchCity._q); searchCity._q = setTimeout(renderStList, 250); }
  else if (id === 'cityQ') searchCity(e.target.value.trim());
});
document.addEventListener('change', function (e) {
  var k = e.target.getAttribute && e.target.getAttribute('data-set');
  if (!k) return;
  var val = e.target.value;
  if (k === 'snooze' || k === 'fadeSec' || k === 'dawnMin' || k === 'dawnBefore') val = +val;
  if ((k === 'nightStart' || k === 'nightEnd') && !val) return;
  S[k] = val; save(); updNight();
});

function doUnlock() {
  if (unlocked) return;
  unlockAudio();
  $('unlock').classList.add('off');
  fetchStations();
  setTimeout(checkAudioHealth, 1500);
}

/* Resynchronisation au retour au premier plan */
function resync() { resumeAudio(); lastMin = -1; tick(); if (!WX || Date.now() - WX.t > 15 * 60000) fetchWx(); }
document.addEventListener('visibilitychange', function () { if (!document.hidden) resync(); });
window.addEventListener('pageshow', resync);
window.addEventListener('focus', resync);

/* Icône d'écran d'accueil générée : heure rouge + soleil levant orange */
(function makeIcon() {
  try {
